<svg width="220" height="64" viewBox="0 0 220 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HeyPsych logo">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="wordmarkGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: 'InterSubset';
        font-style: normal;
        font-weight: 700;
        src: url(data:font/truetype;charset=utf-8;base64,) format('truetype');
      }
      .logo-icon-text {
        font-family: 'InterSubset', 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
        alignment-baseline: central;
      }
      .logo-wordmark {
        font-family: 'InterSubset', 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
        dominant-baseline: middle;
      }
    ]]></style>
  </defs>

  <rect x="8" y="16" width="32" height="32" rx="8" fill="url(#iconGradient)" />
  <text x="24" y="32" class="logo-icon-text" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">H</text>
  <text x="48" y="32" class="logo-wordmark" fill="url(#wordmarkGradient)" dominant-baseline="middle">HeyPsych</text>
</svg>
