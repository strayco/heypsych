  no-js-content:
    name: Verify Content Without JavaScript (LLM Retrieval)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set up environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> .env.local

      - name: Build Next.js app
        run: npm run build

      - name: Start Next.js server
        run: |
          npm run start &
          # Wait for server to be ready
          npx wait-on http://localhost:3000 -t 60000

      - name: Run No-JS Content Tests
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/no-js-content.spec.ts

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-no-js-report
          path: playwright-report/
          retention-days: 30

      - name: Test Results Summary
        if: always()
        run: |
          echo "## No-JS Content Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Verified that core content is available in initial HTML payload without JavaScript" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This ensures LLM crawlers (Gemini, GPTBot, Google-Extended) can extract content even if:" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript is disabled" >> $GITHUB_STEP_SUMMARY
          echo "- Crawler times out before React hydration" >> $GITHUB_STEP_SUMMARY
          echo "- Bot doesn't execute JavaScript at all" >> $GITHUB_STEP_SUMMARY

