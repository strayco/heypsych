name: SEO Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  seo-validation:
    name: Validate SEO Health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env.local
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env.local
          echo "DATABASE_URL=$DATABASE_URL" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env.local

      - name: Run SEO Metrics
        id: metrics
        run: |
          npm run seo:metrics:json > seo-report.json || echo "METRICS_FAILED=true" >> $GITHUB_ENV
          cat seo-report.json

      - name: Upload SEO Report
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo-report.json
          retention-days: 30

      - name: Parse Results
        if: always()
        run: |
          # Extract key metrics from report
          HEALTH_SCORE=$(cat seo-report.json | jq -r '.summary.health_score')
          ISSUES_COUNT=$(cat seo-report.json | jq -r '.summary.issues_count')

          echo "Health Score: $HEALTH_SCORE/100"
          echo "Issues Found: $ISSUES_COUNT"

          # Set job summary
          echo "## SEO Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Health Score:** $HEALTH_SCORE/100" >> $GITHUB_STEP_SUMMARY
          echo "**Issues:** $ISSUES_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add issues to summary
          if [ "$ISSUES_COUNT" -gt "0" ]; then
            echo "### ❌ Issues Found" >> $GITHUB_STEP_SUMMARY
            cat seo-report.json | jq -r '.issues[]' | while read issue; do
              echo "- $issue" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Check Quality Gate
        if: always()
        run: |
          ISSUES_COUNT=$(cat seo-report.json | jq -r '.summary.issues_count')

          if [ "$ISSUES_COUNT" -gt "0" ]; then
            echo "❌ SEO quality gate failed: $ISSUES_COUNT issue(s) found"
            echo ""
            echo "Issues that must be fixed:"
            cat seo-report.json | jq -r '.issues[]' | while read issue; do
              echo "  • $issue"
            done
            exit 1
          fi

          echo "✅ SEO quality gate passed"

